<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#070B09">
  <title>话里有事 · 群聊待办提取器</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="mesh" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>

  <nav class="dock">
    <span class="dock__brand"><span class="dot" aria-hidden="true"></span>话里有事</span>
    <span class="dock__meta">本地运行 · 不联网</span>
  </nav>

  <main class="wrap">
    <header class="hero">
      <p class="eyebrow"><span class="eyebrow__dot" aria-hidden="true"></span>群聊待办提取器 · 无需联网 · 无需密钥</p>
      <h1 class="hero__title">话里有事</h1>
      <p class="hero__sub">把群聊记录贴进来，自动抽出要做的事、截止时间，和跟你有关的提醒。</p>
    </header>

    <div class="grid">
      <div class="side" id="side">
        <section class="panel console" id="console">
          <div class="panel__inner">
            <div class="panel__head">
              <h2 class="panel__title">输入台</h2>
              <span class="panel__tag mono">群聊记录</span>
            </div>
            <textarea id="chat" spellcheck="false" placeholder="每行一条，格式：昵称 时间 内容&#10;班长 09:15 明天下午5点前交高数作业"></textarea>
            <div class="actions">
              <button type="button" id="extract" class="btn btn--primary">
                <span>提取待办</span>
                <span class="btn__icon" aria-hidden="true">↗</span>
              </button>
              <button type="button" id="sample" class="btn btn--ghost">填入示例</button>
              <button type="button" id="clear" class="btn btn--ghost">清空</button>
            </div>
            <p id="hint" class="hint" role="status" aria-live="polite"></p>
          </div>
        </section>

        <section class="panel detail" id="detail" hidden>
          <div class="panel__inner">
            <div class="panel__head">
              <h2 class="panel__title">解析</h2>
              <button type="button" id="detail-close" class="btn btn--ghost btn--sm">返回输入台</button>
            </div>
            <p class="detail__text" id="detail-text"></p>
            <div class="detail__meta" id="detail-meta"></div>
            <div class="detail__block">
              <p class="detail__label">提取依据</p>
              <ul class="detail__reasons" id="detail-reasons"></ul>
            </div>
            <div class="detail__block">
              <p class="detail__label">原文</p>
              <p class="detail__source" id="detail-source"></p>
            </div>
          </div>
        </section>
      </div>

      <section class="output">
        <div id="placeholder" class="panel placeholder">
          <div class="panel__inner">
            <p class="placeholder__icon mono" aria-hidden="true">[ ]</p>
            <p class="placeholder__title">还没有结果</p>
            <p class="placeholder__sub">贴一段群聊记录，点「提取待办」开始。</p>
          </div>
        </div>

        <section id="result" class="result" hidden>
          <div class="stats">
            <div class="panel stat">
              <div class="panel__inner">
                <span class="stat__label">待办</span>
                <span class="stat__num mono" id="stat-open">0</span>
              </div>
            </div>
            <div class="panel stat">
              <div class="panel__inner">
                <span class="stat__label">与你相关</span>
                <span class="stat__num mono" id="stat-relevant">0</span>
              </div>
            </div>
            <div class="panel stat">
              <div class="panel__inner">
                <span class="stat__label">待确认</span>
                <span class="stat__num mono" id="stat-confirm">0</span>
              </div>
            </div>
            <div class="panel stat">
              <div class="panel__inner">
                <span class="stat__label">已完成</span>
                <span class="stat__num mono" id="stat-done">0</span>
              </div>
            </div>
          </div>

          <div class="panel results">
            <div class="panel__inner">
              <div class="results__head">
                <nav class="tabs" aria-label="按状态筛选">
                  <button type="button" class="tab active" data-filter="todo">待办</button>
                  <button type="button" class="tab" data-filter="confirm">待确认</button>
                  <button type="button" class="tab" data-filter="done">已完成</button>
                </nav>
                <button type="button" id="export" class="btn btn--ghost btn--sm">导出 JSON</button>
              </div>
              <p id="summary" class="summary"></p>
              <ul id="list" class="list"></ul>
            </div>
          </div>
        </section>
      </section>
    </div>

    <footer class="foot">
      <p>演示数据均为合成数据 · 数据只存在本浏览器 · 不联网、不接模型</p>
    </footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
