<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#F4EFE6">
  <title>话里有事 · 群聊待办提取器</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- 斜向撞色背景带，故意不对称 -->
  <div class="bg" aria-hidden="true"></div>

  <header class="topbar">
    <span class="brand">话里有事<span class="brand__star" aria-hidden="true">*</span></span>
    <span class="topbar__tags">
      <span class="tag tag--acid">本地运行</span>
      <span class="tag">不联网 · 不接模型</span>
    </span>
  </header>

  <main class="page">
    <section class="hero">
      <p class="kicker">群聊待办提取器<span class="kicker__line" aria-hidden="true"></span></p>
      <h1 class="title">话里有事</h1>
      <div class="hero__row">
        <p class="sub">把群聊记录贴进来，自动抽出要做的事、截止时间，和跟你有关的提醒。</p>
        <span class="stamp" aria-hidden="true">贴 &amp; 提</span>
      </div>
    </section>

    <div class="layout">
      <!-- 左：结果 -->
      <section class="col col--results">
        <div id="placeholder" class="box placeholder">
          <p class="placeholder__title">还没贴内容？先看个示例</p>
          <p class="placeholder__sub">它能从一段群聊里，抽出「截止时间」「@你」「面向全班」的待办。</p>
          <button type="button" id="quickstart" class="btn btn--primary">
            <span>填入示例并提取</span>
            <span class="btn__icon" aria-hidden="true">↗</span>
          </button>
        </div>

        <section id="result" class="result" hidden>
          <div class="stats">
            <div class="stat stat--big stat--acid">
              <span class="stat__label">待办</span>
              <span class="stat__num" id="stat-open">0</span>
            </div>
            <div class="stat stat--blue">
              <span class="stat__label">与你相关</span>
              <span class="stat__num" id="stat-relevant">0</span>
            </div>
            <div class="stat stat--pink">
              <span class="stat__label">待确认</span>
              <span class="stat__num" id="stat-confirm">0</span>
            </div>
            <div class="stat stat--mint">
              <span class="stat__label">已完成</span>
              <span class="stat__num" id="stat-done">0</span>
            </div>
          </div>

          <div class="box listbox">
            <div class="listbox__head">
              <nav class="tabs" aria-label="按状态筛选">
                <button type="button" class="tab active" data-filter="todo">待办</button>
                <button type="button" class="tab" data-filter="confirm">待确认</button>
                <button type="button" class="tab" data-filter="done">已完成</button>
              </nav>
              <button type="button" id="export" class="btn btn--ghost btn--sm">导出 JSON</button>
            </div>
            <p id="summary" class="summary"></p>
            <ul id="list" class="list"></ul>
          </div>
        </section>
      </section>

      <!-- 右：控制台 / 解析 -->
      <aside class="col col--side" id="side">
        <section class="box console" id="console">
          <div class="console__head">
            <h2 class="boxtitle">输入台</h2>
            <span class="tag mono">群聊记录</span>
          </div>
          <textarea id="chat" spellcheck="false" placeholder="每行一条，格式：昵称 时间 内容&#10;班长 09:15 明天下午5点前交高数作业"></textarea>
          <div class="actions">
            <button type="button" id="extract" class="btn btn--primary">
              <span>提取待办</span>
              <span class="btn__icon" aria-hidden="true">↗</span>
            </button>
            <button type="button" id="sample" class="btn btn--ghost">填入示例</button>
            <button type="button" id="clear" class="btn btn--ghost">清空</button>
          </div>
          <p id="hint" class="hint" role="status" aria-live="polite"></p>
        </section>

        <section class="box detail" id="detail" hidden>
          <div class="console__head">
            <h2 class="boxtitle">解析</h2>
            <button type="button" id="detail-close" class="btn btn--ghost btn--sm">返回输入台</button>
          </div>
          <p class="detail__text" id="detail-text"></p>
          <div class="detail__meta" id="detail-meta"></div>
          <div class="detail__block">
            <p class="detail__label">提取依据</p>
            <ul class="detail__reasons" id="detail-reasons"></ul>
          </div>
          <div class="detail__block">
            <p class="detail__label">原文</p>
            <p class="detail__source" id="detail-source"></p>
          </div>
        </section>
      </aside>
    </div>

    <footer class="foot">
      <p>演示数据均为合成数据 · 数据只存在本浏览器 · 不联网、不接模型</p>
    </footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
